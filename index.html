<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小船专供：扬州初中英语考题周报</title>
<style>
/* ===== Theme Variables ===== */
:root {
  --bg: #0a0e14;
  --card-bg: #141b22;
  --card-hover: #1a2332;
  --border: #1e293b;
  --text: #c9d1d9;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --accent2: #f78166;
  --accent3: #7ee787;
  --accent4: #d2a8ff;
  --tag-bg: #1a2332;
  --tag-text: #79c0ff;
  --divider: #1c2534;
  --step-bg: #0f1724;
  --grade7: #58a6ff;
  --grade8: #f78166;
  --grade9: #d2a8ff;
  --success: #7ee787;
  --warn: #d29922;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== Header ===== */
header {
  background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  border-bottom: 2px solid var(--accent);
  padding: 20px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.logo-area { display: flex; align-items: center; gap: 12px; }

.logo-icon {
  font-size: 32px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.title-group h1 {
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent4));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.title-group .subtitle {
  font-size: 12px;
  color: var(--text-muted);
}

.header-stats {
  display: flex;
  gap: 16px;
  font-size: 13px;
  color: var(--text-muted);
}

.header-stats span { color: var(--accent); font-weight: 600; }

/* ===== Search Bar ===== */
.search-wrap {
  max-width: 1200px;
  margin: 16px auto;
  padding: 0 24px;
}

.search-box {
  display: flex;
  align-items: center;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  transition: border-color 0.2s;
}

.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
}

.search-icon { font-size: 16px; margin-right: 10px; }

.search-box input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-size: 15px;
  outline: none;
}

.search-box input::placeholder { color: var(--text-muted); }

.search-clear {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 8px;
  border-radius: 4px;
  display: none;
}

.search-clear.visible { display: block; }
.search-clear:hover { color: var(--accent2); }

.search-count {
  font-size: 12px;
  color: var(--text-muted);
  margin-left: 8px;
  white-space: nowrap;
}

/* ===== Filter Bar ===== */
.filter-bar {
  max-width: 1200px;
  margin: 0 auto 16px;
  padding: 0 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

.filter-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-right: 4px;
  white-space: nowrap;
}

.filter-chip {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--text-muted);
  transition: all 0.2s;
  white-space: nowrap;
  user-select: none;
}

.filter-chip:hover {
  border-color: var(--accent);
  color: var(--text);
}

.filter-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.filter-chip.grade7.active { background: var(--grade7); border-color: var(--grade7); }
.filter-chip.grade8.active { background: var(--grade8); border-color: var(--grade8); }
.filter-chip.grade9.active { background: var(--grade9); border-color: var(--grade9); }

.filter-divider {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 6px;
}

.active-filters {
  font-size: 12px;
  color: var(--accent);
  margin-left: 8px;
  display: none;
}

.active-filters.visible { display: inline; }

/* ===== Main Content ===== */
main {
  max-width: 1200px;
  margin: 0 auto 40px;
  padding: 0 24px;
  display: flex;
  flex-direction: column-reverse;
}

/* ===== Week Section ===== */
.week-section {
  margin-bottom: 32px;
}

.week-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--divider);
}

.week-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}

.week-header h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
}

.week-badge {
  font-size: 12px;
  background: var(--tag-bg);
  color: var(--tag-text);
  padding: 3px 10px;
  border-radius: 12px;
}

/* ===== Grade Section ===== */
.grade-section {
  margin-bottom: 24px;
}

.grade-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  padding: 4px 14px;
  border-radius: 6px;
}

.grade-label.g7 {
  background: rgba(88, 166, 255, 0.1);
  color: var(--grade7);
}

.grade-label.g8 {
  background: rgba(247, 129, 102, 0.1);
  color: var(--grade8);
}

.grade-label.g9 {
  background: rgba(210, 168, 255, 0.1);
  color: var(--grade9);
}

/* ===== Type Group ===== */
.type-group {
  margin-bottom: 16px;
}

.type-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
  padding-left: 4px;
}

/* ===== Question Cards ===== */
.questions-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.question-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
}

.question-card:hover {
  border-color: var(--accent);
  background: var(--card-hover);
}

.question-card.active {
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(88, 166, 255, 0.08);
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.q-number {
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
  white-space: nowrap;
}

.q-text {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  line-height: 1.7;
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
}

.meta-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--tag-bg);
  color: var(--tag-text);
}

.meta-tag.source {
  color: var(--text-muted);
  font-style: italic;
}

.meta-tag.type-tag {
  background: rgba(210, 168, 255, 0.15);
  color: var(--accent4);
}

/* ===== Answer Section (expandable) ===== */
.answer-section {
  display: none;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--divider);
}

.question-card.active .answer-section { display: block; }

.answer-box {
  background: var(--step-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 10px;
}

.answer-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent3);
  margin-bottom: 6px;
}

.answer-content {
  font-size: 14px;
  color: var(--text);
  line-height: 1.7;
}

.explanation-box {
  background: rgba(210, 168, 255, 0.05);
  border: 1px solid rgba(210, 168, 255, 0.15);
  border-radius: 8px;
  padding: 14px;
}

.explanation-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent4);
  margin-bottom: 6px;
}

.explanation-content {
  font-size: 13px;
  color: var(--text);
  line-height: 1.8;
}

/* ===== Expand Hint ===== */
.expand-hint {
  font-size: 11px;
  color: var(--text-muted);
  text-align: right;
  margin-top: 4px;
  opacity: 0.6;
}

.question-card.active .expand-hint { opacity: 1; color: var(--accent); }

/* ===== No Results ===== */
.no-results {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
  font-size: 15px;
}

.no-results .emoji { font-size: 40px; display: block; margin-bottom: 12px; }

/* ===== Footer ===== */
footer {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 24px 40px;
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  border-top: 1px solid var(--divider);
}

footer a { color: var(--accent); text-decoration: none; }

/* ===== Filtered / Hidden States ===== */
.question-card.filtered-out { display: none; }
.type-group.filtered-empty { display: none; }
.grade-section.filtered-empty { display: none; }
.week-section.filtered-empty { display: none; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .header-inner { flex-direction: column; align-items: flex-start; }
  .filter-bar { gap: 6px; }
  .filter-chip { padding: 4px 10px; font-size: 12px; }
  .title-group h1 { font-size: 18px; }
}

/* ===== Loading pulse for cron-added sections ===== */
@keyframes pulse-border {
  0%, 100% { border-color: var(--border); }
  50% { border-color: var(--accent); }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="header-inner">
    <div class="logo-area">
      <span class="logo-icon">⛵</span>
      <div class="title-group">
        <h1>小船专供：扬州初中英语考题周报</h1>
        <div class="subtitle">扬州地区 · 初一至初三 · 近三年真题及权威模拟题</div>
      </div>
    </div>
    <div class="header-stats">
      <div>📚 总期数 <span id="total-weeks">1</span></div>
      <div>📝 总题数 <span id="total-questions">0</span></div>
      <div>🔄 每周一更新</div>
    </div>
  </div>
</header>

<!-- ===== SEARCH ===== -->
<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="搜索题目、知识点、来源…">
    <button class="search-clear" id="search-clear">✕</button>
    <span class="search-count" id="search-count"></span>
  </div>
</div>

<!-- ===== FILTER BAR ===== -->
<div class="filter-bar" id="filter-bar">
  <span class="filter-label">📅 年级：</span>
  <span class="filter-chip grade7 active" data-filter="grade" data-value="grade7">初一</span>
  <span class="filter-chip grade8 active" data-filter="grade" data-value="grade8">初二</span>
  <span class="filter-chip grade9 active" data-filter="grade" data-value="grade9">初三</span>

  <span class="filter-divider"></span>
  <span class="filter-label">📋 题型：</span>
  <span class="filter-chip active" data-filter="type" data-value="all">全部</span>
  <span class="filter-chip" data-filter="type" data-value="单项选择">单项选择</span>
  <span class="filter-chip" data-filter="type" data-value="完形填空">完形填空</span>
  <span class="filter-chip" data-filter="type" data-value="词汇运用">词汇运用</span>
  <span class="filter-chip" data-filter="type" data-value="阅读理解">阅读理解</span>
  <span class="filter-chip" data-filter="type" data-value="任务型阅读">任务型阅读</span>
  <span class="filter-chip" data-filter="type" data-value="选句填空">选句填空</span>
  <span class="filter-chip" data-filter="type" data-value="书面表达">书面表达</span>
  <span class="filter-chip" data-filter="type" data-value="句子翻译">句子翻译</span>
  <span class="filter-chip" data-filter="type" data-value="句型转换">句型转换</span>
  <span class="filter-chip" data-filter="type" data-value="语法填空">语法填空</span>

  <span class="filter-divider"></span>
  <span class="filter-label">📆 日期：</span>
  <span class="filter-chip active" data-filter="week" data-value="all">全部</span>
  <span class="filter-chip" data-filter="week" data-value="week-1">第1周</span>
  <!-- Week chips populated by JS -->

  <span class="active-filters" id="active-filters-count"></span>
</div>

<!-- ===== MAIN CONTENT ===== -->
<main id="content">

  <!-- Week sections will be inserted here -->
  <!-- WEEKLY_CONTENT_START -->

  <div class="no-results" id="placeholder">
    <span class="emoji">⏳</span>
    <p>第一期考题正在准备中…<br>每周一自动更新，敬请期待！</p>
  </div>

  <!-- WEEKLY_CONTENT_END -->

</main>

<!-- ===== FOOTER ===== -->
<footer>
  <p>🚀 Powered by Hermes Agent · 数据来源：近三年扬州中考真题及教育类权威网站 · 每周一自动更新</p>
  <p>题目来源标注于每题下方，仅供学习参考 · <a href="https://github.com/Wallbreaker3906/yangzhou-english-weekly" target="_blank">GitHub</a></p>
</footer>

<script>
(function() {
  // ===== DOM Refs =====
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');
  const searchCount = document.getElementById('search-count');
  const filterBar = document.getElementById('filter-bar');
  const content = document.getElementById('main' === 'main' ? null : document.querySelector('main'));
  const activeFiltersCount = document.getElementById('active-filters-count');

  // Use main tag
  const mainEl = document.querySelector('main');

  // ===== State =====
  let activeGrades = new Set(['grade7', 'grade8', 'grade9']);
  let activeType = 'all';
  let activeWeek = 'all';

  // ===== Filter Chips =====
  filterBar.addEventListener('click', function(e) {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    const filter = chip.dataset.filter;
    const value = chip.dataset.value;

    if (filter === 'grade') {
      if (activeGrades.has(value)) {
        if (activeGrades.size > 1) {
          activeGrades.delete(value);
          chip.classList.remove('active');
        }
      } else {
        activeGrades.add(value);
        chip.classList.add('active');
      }
    } else if (filter === 'type') {
      // Deselect all type chips
      filterBar.querySelectorAll('[data-filter="type"]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeType = value;
    } else if (filter === 'week') {
      filterBar.querySelectorAll('[data-filter="week"]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeWeek = value;
    }

    applyFilters();
    updateActiveFilterCount();
  });

  // ===== Search =====
  searchInput.addEventListener('input', function() {
    const query = this.value.trim().toLowerCase();
    if (query) {
      searchClear.classList.add('visible');
    } else {
      searchClear.classList.remove('visible');
    }
    applyFilters();
  });

  searchClear.addEventListener('click', function() {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    searchCount.textContent = '';
    applyFilters();
  });

  // ===== Card Click (expand) =====
  mainEl.addEventListener('click', function(e) {
    const card = e.target.closest('.question-card');
    if (!card) return;
    card.classList.toggle('active');
  });

  // ===== Apply Filters =====
  function applyFilters() {
    const query = searchInput.value.trim().toLowerCase();
    let totalVisible = 0;
    let totalCards = 0;

    const cards = mainEl.querySelectorAll('.question-card');
    totalCards = cards.length;

    cards.forEach(card => {
      const gradeEl = card.closest('.grade-section');
      const weekEl = card.closest('.week-section');
      const grade = gradeEl ? gradeEl.dataset.grade : '';
      const week = weekEl ? weekEl.dataset.week : '';
      const type = card.dataset.type || '';

      let visible = true;

      // Grade filter
      if (grade && !activeGrades.has(grade)) visible = false;

      // Type filter
      if (activeType !== 'all' && type !== activeType) visible = false;

      // Week filter
      if (activeWeek !== 'all' && week !== activeWeek) visible = false;

      // Search
      if (query) {
        const cardText = card.textContent.toLowerCase();
        if (!cardText.includes(query)) visible = false;
      }

      if (visible) {
        card.classList.remove('filtered-out');
        totalVisible++;
      } else {
        card.classList.add('filtered-out');
      }
    });

    // Hide empty groups
    mainEl.querySelectorAll('.type-group').forEach(group => {
      const visibleCards = group.querySelectorAll('.question-card:not(.filtered-out)');
      if (visibleCards.length === 0) {
        group.classList.add('filtered-empty');
      } else {
        group.classList.remove('filtered-empty');
      }
    });

    mainEl.querySelectorAll('.grade-section').forEach(section => {
      const visibleGroups = section.querySelectorAll('.type-group:not(.filtered-empty)');
      if (visibleGroups.length === 0) {
        section.classList.add('filtered-empty');
      } else {
        section.classList.remove('filtered-empty');
      }
    });

    mainEl.querySelectorAll('.week-section').forEach(section => {
      const visibleGrades = section.querySelectorAll('.grade-section:not(.filtered-empty)');
      if (visibleGrades.length === 0) {
        section.classList.add('filtered-empty');
      } else {
        section.classList.remove('filtered-empty');
      }
    });

    // Update search count
    if (query) {
      searchCount.textContent = totalVisible + '/' + totalCards;
    } else {
      searchCount.textContent = '';
    }

    // Update placeholder
    const placeholder = document.getElementById('placeholder');
    if (placeholder && totalCards > 0 && totalVisible === 0) {
      placeholder.style.display = 'block';
      placeholder.querySelector('.emoji').textContent = '🔍';
      placeholder.querySelector('p').textContent = '没有找到匹配的题目，试试其他筛选条件吧～';
    } else if (placeholder && totalCards > 0) {
      placeholder.style.display = 'none';
    }
  }

  // ===== Update Active Filter Count =====
  function updateActiveFilterCount() {
    const gradeCount = activeGrades.size;
    const totalGrades = 3;
    if (gradeCount < totalGrades || activeType !== 'all' || activeWeek !== 'all') {
      activeFiltersCount.classList.add('visible');
      let parts = [];
      if (gradeCount < totalGrades) parts.push(gradeCount + '/' + totalGrades + '个年级');
      if (activeType !== 'all') parts.push('题型: ' + activeType);
      if (activeWeek !== 'all') parts.push('周: ' + activeWeek);
      activeFiltersCount.textContent = '（已筛选: ' + parts.join(' | ') + '）';
    } else {
      activeFiltersCount.classList.remove('visible');
    }
  }

  // ===== Populate Week Dropdown =====
  function updateWeekChips() {
    const weekChips = filterBar.querySelectorAll('[data-filter="week"]:not([data-value="all"])');
    const weekSections = mainEl.querySelectorAll('.week-section');
    const existingWeeks = new Set();
    weekSections.forEach(s => {
      if (s.dataset.week) existingWeeks.add(s.dataset.week);
    });

    // Remove chips for weeks that no longer exist
    weekChips.forEach(chip => {
      if (!existingWeeks.has(chip.dataset.value)) {
        chip.remove();
      }
    });

    // Add chips for new weeks
    existingWeeks.forEach(weekValue => {
      const exists = filterBar.querySelector('[data-filter="week"][data-value="' + weekValue + '"]');
      if (!exists) {
        const allChip = filterBar.querySelector('[data-filter="week"][data-value="all"]');
        const newChip = document.createElement('span');
        newChip.className = 'filter-chip';
        newChip.dataset.filter = 'week';
        newChip.dataset.value = weekValue;
        newChip.textContent = weekValue.replace('week-', '第') + '周';
        allChip.after(newChip);
      }
    });
  }

  // ===== Stats Update =====
  function updateStats() {
    const totalCards = mainEl.querySelectorAll('.question-card').length;
    const totalWeeks = mainEl.querySelectorAll('.week-section').length;
    document.getElementById('total-questions').textContent = totalCards;
    document.getElementById('total-weeks').textContent = totalWeeks;
  }

  // ===== Init =====
  updateWeekChips();
  updateStats();
  applyFilters();

  // Expose for content injection
  window.englishWeekly = {
    refresh: function() {
      updateWeekChips();
      updateStats();
      applyFilters();
    }
  };

})();
</script>

</body>
</html>
